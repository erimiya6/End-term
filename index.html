<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SST LOST & FOUND</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
    <h1>SST LOST & FOUND</h1>
    <p>Helping Peers Reconnect with Their Belongings</p>
</header>

<div class="container">

    <!-- Lost / Found Toggle Buttons -->
    <div class="type-toggle top-toggle">
        <button id="lostBtn" class="active" onclick="setType('Lost')">Report Lost</button>
        <button id="foundBtn" onclick="setType('Found')">Report Found</button>
    </div>

    <!-- Item Report Form -->
    <div class="form-box">
        <h2>Report Item</h2>

        <form id="itemForm">
            <input type="hidden" id="type" value="Lost">

            <input type="text" id="itemName" placeholder="Item Name" required>
            <textarea id="description" placeholder="Description" required></textarea>
            <input type="text" id="itemLocation" placeholder="Location" required>
            <input type="text" id="contact" placeholder="Contact Number" required>

            <button type="submit" id="submitBtn" disabled>Submit Item</button>
        </form>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-box">
        <button class="filter-btn active" id="allFilter" onclick="filterItems('All', this)">All</button>
        <button class="filter-btn" onclick="filterItems('Lost', this)">Lost</button>
        <button class="filter-btn" onclick="filterItems('Found', this)">Found</button>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
        <div class="search-wrapper">
            <input type="text" id="searchBox" placeholder="Search item..."
                   onkeyup="searchItem(); toggleClearBtn()">
                   <!-- Clear Text Btn-->
            <span class="clear-btn" id="clearBtn" onclick="clearSearch()">x</span>
        </div>
    </div>

    <!-- Items Display Area -->
    <div class="items" id="result"></div>

</div>

<footer class="footer">
    &copy; Developed by Kannuru Erimiya
</footer>

<script src="script.js"></script>
</body>
</html>
